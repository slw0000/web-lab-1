<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Досье студента</title>
    <link href="style.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
</head>
<body>
    <header>
        <h1>Досье студента</h1>
        <nav class="buttons-container">
            <a href="index.html" class="buttons">К списку студентов</a>
            <a href="form.html" class="buttons">Изменить данные</a>
        </nav>
    </header>
    <main>
        <div class="student-card">
            <h2 id="student-full-name">—</h2>
            <dl class="student-info">
                <div class="info-row">
                    <dt>Группа:</dt>
                    <dd id="student-group">—</dd>
                </div>
                <div class="info-row">
                    <dt>ИСУ id:</dt>
                    <dd id="student-isu-id">—</dd>
                </div>
                <div class="info-row">
                    <dt>Номер общежития:</dt>
                    <dd id="student-dormitory-number">—</dd>
                </div>
                <div class="info-row">
                    <dt>Комната:</dt>
                    <dd id="student-room">—</dd>
                </div>
                <div class="info-row">
                    <dt>Срок заселения:</dt>
                    <dd id="student-move-in-date">—</dd>
                </div>
                <div class="info-row">
                    <dt>Иностранец:</dt>
                    <dd id="student-foreigner">—</dd>
                </div>
                <div class="info-row">
                    <dt>Заметки:</dt>
                    <dd id="student-notes">—</dd>
                </div>
            </dl>
        </div>
    </main>
</body>
</html>
