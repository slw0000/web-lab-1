<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список студентов</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Список студентов</h1>
    </header>
    <main>
        <div class="table-container">
            <table class="table">
                <thead>
                    <tr>
                        <th>№</th>
                        <th>Фамилия</th>
                        <th>Имя</th>
                        <th>Отчество</th>
                        <th>Группа</th>
                        <th>ИСУ id</th>
                        <th>Номер общежития</th>
                        <th>Комната</th>
                        <th>Срок заселения</th>
                        <th>Иностранец</th>
                        <th>Заметки</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr>
                        <td>1</td>
                        <td>Иванов</td>
                        <td>Иван</td>
                        <td>Иванович</td>
                        <td>Группа 1</td>
                        <td>123456</td>
                        <td>1</td>
                        <td>101</td>
                        <td>01.09.2026</td>
                        <td>Нет</td>
                        <td></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="buttons-container">
            <button class="buttons add-button">Добавить студента</button>
            <button class="buttons edit-button" disabled>Редактировать студента</button>
            <button class="buttons delete-button" disabled>Удалить студента</button>
            <button class="buttons info-button" disabled>Досье студента</button>
        </div>
    </main>
    <script src="scripts/script.js"></script>
</body>
</html>
